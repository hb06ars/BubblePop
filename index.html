<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#3b174a">
  <title>Bubble Pop — Offline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Bubble <span>Pop</span></h1>
      </div>
      <div class="stats">
        <div class="stat"><small>PONTOS</small><strong id="score">0</strong></div>
        <div class="stat"><small>RECORDE</small><strong id="best">0</strong></div>
      </div>
    </header>

    <section class="game-shell" aria-label="Área do jogo">
      <canvas id="game" aria-label="Jogo de estourar bolhas"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <div class="bubble-logo">●</div>
          <h2 id="overlay-title">Pronto para jogar?</h2>
          <p id="overlay-text">Combine 3 ou mais bolhas da mesma cor para estourá-las.</p>
          <button id="start-btn" class="primary">Iniciar jogo</button>
        </div>
      </div>
    </section>

    <section class="controls">
      <div class="hint" id="hint" role="status" aria-live="polite"></div>
      <nav class="actions" aria-label="Controles do jogo">
        <button id="pause-btn" disabled>Ⅱ Pausar</button>
        <button id="restart-btn">↻ Reiniciar</button>
      </nav>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
